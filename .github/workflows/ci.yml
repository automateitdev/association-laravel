# Test on every push, deploy master to the test server.
#
# ONE WORKFLOW, TWO JOBS, and deliberately not two files. `deploy` needs
# `tests`, so nothing reaches the server that has not just proved itself in the
# same run against the same commit. A separate deploy workflow triggered on
# push would race the test workflow and win about half the time.
#
# WHAT IS NOT HERE: `pint --test`. The tree is not pint-clean today - about
# eighty files differ, most of it CRLF line endings from a Windows checkout -
# so adding it now would mean a red pipeline on day one and a reformat commit
# touching every file. Run pint once, commit that on its own, then add the
# check here.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# EVERY artisan call, including the one composer runs.
#
# `composer install` fires `package:discover`, which boots the application -
# and TenancyGuardServiceProvider refuses to boot on a cache store that cannot
# do tags, because tenant cache isolation IS tags (threat T-2). On a runner
# there is no .env yet at that point, so config/cache.php falls back to
# Laravel's own default of `database`, and the install dies before a single
# test runs.
#
# Set here rather than in a step: a real environment variable outranks .env, so
# this holds for `key:generate` and everything after it too. `array` is right
# for a runner - correct isolation, and nothing on a runner needs a cache that
# outlives the process. The SERVER uses redis; see deploy/README.md.
env:
  CACHE_STORE: array

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs; never cancel a run that might be mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      # NFR-INT-4: real MySQL, never SQLite. The audit queries use DATE_FORMAT
      # and GROUP_CONCAT ... SEPARATOR, the money columns are DECIMAL, and
      # tenancy cannot be tested on :memory: at all - a tenant database is a
      # real database, created and dropped per test.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          # MATCHES THE SERVER, which is Ubuntu 26.04 and therefore PHP 8.5.
          # composer.json requires ^8.3, so 8.4 and 8.5 satisfy it too - which
          # means a mismatch here would not fail, it would just mean the suite
          # never runs on the version the code actually runs on.
          php-version: '8.5'

          # bcmath is not optional: every money figure the server computes goes
          # through it, because floats do not reconcile (FR-MON-4).
          extensions: bcmath, pdo_mysql, mbstring, intl, gd, zip
          coverage: none

      - name: Cache composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --prefer-dist --no-interaction --no-progress

      # phpunit.xml carries the database settings; .env is here only for
      # APP_KEY, which the framework refuses to boot without.
      - name: Application key
        run: |
          cp .env.example .env
          php artisan key:generate

      # The suite creates every TENANT database it needs, but not the central
      # registry it looks them up in.
      # Through PHP rather than the mysql client, which is not guaranteed to be
      # on the runner image and would fail here for a reason that has nothing to
      # do with this project.
      - name: Central test database
        run: php -r "(new PDO('mysql:host=127.0.0.1;port=3306','root',''))->exec('CREATE DATABASE IF NOT EXISTS bcs_central_test');"

      # Serial, not --parallel. Parallel workers share one MySQL server and the
      # tenancy tests create and drop real databases; a first pipeline should
      # fail because the code is wrong, not because two workers collided.
      - run: php artisan test

  deploy:
    name: Deploy to test
    needs: tests
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Scopes the SSH secrets to this job and gives the deploy its own history
    # in the Actions UI. Add required reviewers here if this ever fronts prod.
    environment: test

    concurrency:
      # Two deploys overlapping would rsync into each other's release and race
      # the migrations. Queue them instead - never cancel one that is running.
      group: deploy-test
      cancel-in-progress: false

    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/bcs' }}

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, pdo_mysql, mbstring, intl, gd, zip
          coverage: none

      # Built HERE, not on the server: the test box then needs no composer, no
      # node, and no network to a package registry, and what is deployed is
      # exactly what was resolved from composer.lock.
      - run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      # NO NPM STEP, deliberately. This repo has a package.json for Laravel's
      # stock vite scaffolding and nothing that uses it: the only view with
      # @vite is welcome.blade.php, which checks for build/manifest.json and
      # falls back to inline CSS when there is none - so the page is identical
      # either way. There has never been a lockfile or a node_modules here, and
      # `cache: npm` failed for exactly that reason.
      #
      # If a real front end is ever added, commit package-lock.json first and
      # put `npm ci && npm run build` back here. `npm install` in CI is not the
      # answer: it resolves fresh versions on every deploy, so what ships stops
      # being what was tested.

      - name: SSH key and host pin
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # PINNED, not ssh-keyscan at deploy time. Trusting whatever answers on
          # the way to a server we are about to hand code to is not a check.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # TAR OVER SSH, NOT RSYNC. rsync has to exist on BOTH ends and is not on
      # a minimal Ubuntu; tar is, because it is an essential package. Nothing is
      # lost by the swap either: every release goes into its own empty directory
      # named by commit, so rsync's incremental transfer and --delete had
      # nothing to be incremental about and nothing to delete.
      #
      # The excludes are written './name' so they anchor to the top level.
      # Unanchored, '--exclude=tests' would also drop vendor/*/tests and
      # '--exclude=storage' any vendor directory of that name.
      - name: Upload the release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          RELEASE: ${{ github.sha }}
        run: |
          # Without pipefail a failing tar is hidden by ssh's exit status, and
          # a truncated release would go live looking like a success.
          set -o pipefail

          tar -czf - \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./tests' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./storage' \
            . \
          | ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
              "mkdir -p '$DEPLOY_PATH/releases/$RELEASE' && tar -xzf - -C '$DEPLOY_PATH/releases/$RELEASE'"

      # The script lives in the repo rather than in this file: it is the part
      # that touches a database with real money in it, and it should be
      # reviewable in a diff and runnable by hand during an incident.
      - name: Release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            'bash -s' -- "$DEPLOY_PATH" "${{ github.sha }}" < deploy/release.sh

      - name: Smoke test
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        # A deploy that finished is not a deploy that works. /health is the one
        # endpoint that needs no tenant and no token.
        if: env.HEALTH_URL != ''
        run: curl --fail --silent --show-error --max-time 20 "$HEALTH_URL"

      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/id_deploy
