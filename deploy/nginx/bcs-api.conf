# The API and the platform console.  ->  /etc/nginx/sites-available/bcs-api
#
# PORT 9000, NOT server_name. Two vhosts on one box are normally told apart by
# hostname, which needs DNS pointed here; ports need nothing, so this works on a
# bare IP today and can move to names and TLS later without changing anything
# the deploy does.
#
# CHECK 9000 IS FREE FIRST: `ss -lntp | grep :9000`. It is php-fpm's own default
# TCP listener, and while Debian and Ubuntu ship a unix socket instead, a pool
# configured the upstream way already holds this port - nginx then fails to
# start with "Address already in use" and takes the app vhost down with it.
server {
    # NOT 0.0.0.0. Caddy terminates TLS on 443 and forwards here, so the only
    # clients that need to reach this are the host itself and the docker bridge
    # gateway - 172.18.0.1 is how a container reaches the host on this box
    # (`docker network inspect <net>` if that ever changes).
    #
    # Bound this way the port never faces the internet, so there is nothing to
    # open at the provider firewall and no plaintext route around the TLS.
    listen 127.0.0.1:9000;
    listen 172.18.0.1:9000;

    # Any Host header, because there is no name to match on yet. When DNS
    # exists, put the real name here and move to 80/443.
    server_name _;

    # THE SYMLINK, never a release directory. `current` is what release.sh
    # repoints, and a config naming a release would serve that one for ever.
    root /var/www/bcs/current/public;

    index index.php;
    charset utf-8;

    # A member may attach 5 documents of 8 MB to one payment, so a legitimate
    # request reaches about 40 MB. nginx's default is 1 MB and rejects those
    # with a 413 before PHP sees them - which the app can only report as a
    # failed upload with no reason. PHP needs raising to match; see the README.
    client_max_body_size 48m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # THE VERSIONED SOCKET, not /run/php/php-fpm.sock. That one is a symlink
        # into /etc/alternatives, and on this host it does not lead anywhere
        # nginx can connect to - the symptom is a 502 with "No such file or
        # directory" naming a socket that visibly exists.
        #
        # `ls -l /run/php/` and use the phpX.Y-fpm.sock entry.
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;

        # $realpath_root, NOT $document_root. With a symlinked release the two
        # differ, and $document_root leaves php-fpm serving whatever opcache
        # remembers of the previous one - a deploy that changes nothing.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Reports take real work; the default 60s cuts a large export off
        # mid-download and it arrives truncated rather than failing.
        fastcgi_read_timeout 120;
    }

    # Dotfiles, except ACME's. Nothing here should ever serve .env or .git.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/bcs-api.access.log;
    error_log  /var/log/nginx/bcs-api.error.log;
}
