# The app in a browser.  ->  /etc/nginx/sites-available/bcs-app
#
# Static files only. This is `expo export --platform web` output, deployed by
# bcs-app-rn's own workflow; there is no PHP here and no API - the browser calls
# the API on :9000 directly, using the absolute URL baked in at build time.
server {
    # NOT 0.0.0.0. Caddy terminates TLS on 443 and forwards here, so the only
    # clients that need to reach this are the host itself and the docker bridge
    # gateway - 172.18.0.1 is how a container reaches the host on this box
    # (`docker network inspect <net>` if that ever changes).
    #
    # Bound this way the port never faces the internet, so there is nothing to
    # open at the provider firewall and no plaintext route around the TLS.
    listen 127.0.0.1:9001;
    listen 172.18.0.1:9001;

    server_name _;

    # Matches WEB_ROOT in the app repo's deploy workflow. That workflow uploads
    # beside this directory and `mv`s it into place, so a visitor mid-deploy
    # gets the whole old site or the whole new one, never half of either.
    root /var/www/bcs-app;

    index index.html;
    charset utf-8;

    # `output: "static"` in app.json, so every route was exported as a real
    # file: /sign-in is sign-in.html on disk. $uri.html is what serves it
    # without the extension. index.html last, for a deep link to a route that
    # was added after this build - expo-router then resolves it client-side.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Hashed filenames, so they can never be stale - a changed file is a
    # changed name. Everything else stays uncached, or a deploy leaves testers
    # looking at yesterday's app and reporting bugs that are already fixed.
    location /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/bcs-app.access.log;
    error_log  /var/log/nginx/bcs-app.error.log;
}
